# Publica las Edge Functions de Mycen en Supabase sin terminal: life-reminders (avisos push de Life OS) y
# quarantine-held-files (evidencia privada, docs/seguridad/csam.md). Las de Business (approve-access-request,
# import-menu-pdf, mozo-login, send-reservation-email) no se publican: Business está cerrado y ya se borraron.
#
# Se corre a mano (GitHub → Actions → "Publicar funciones de Supabase" → Run workflow) o sola cuando se mergea a main
# un cambio en esas carpetas. Sin el secreto SUPABASE_ACCESS_TOKEN avisa y termina sin fallar.
# Pasos para el dueño: docs/lanzamiento/web-push.md
#
# Flags por función:
#   life-reminders         --no-verify-jwt: la llama el cron de la base con la cabecera x-cron-secret (no una cuenta);
#                          sin esa clave responde 401.
#   quarantine-held-files  con verificación del JWT (la de siempre): la llama el panel con la sesión del super-admin.
# --use-api: Supabase arma el paquete en su servidor (sin Docker en la máquina de GitHub).
name: Publicar funciones de Supabase

on:
  workflow_dispatch:
    inputs:
      function:
        description: Qué función publicar
        type: choice
        options:
          - todas
          - life-reminders
          - quarantine-held-files
        default: todas
  push:
    branches: [main]
    paths:
      - 'supabase/functions/life-reminders/**'
      - 'supabase/functions/quarantine-held-files/**'
      - '.github/workflows/deploy-functions.yml'

permissions:
  contents: read

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # El identificador del proyecto es público (está en las direcciones de la API). Se puede cambiar con la
      # variable SUPABASE_PROJECT_REF del repo (Settings → Secrets and variables → Actions → Variables).
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'fcuiolmzfnhxyukkyeht' }}
      WHICH: ${{ github.event_name == 'workflow_dispatch' && inputs.function || 'todas' }}
    steps:
      - name: Revisar el token de Supabase
        id: token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            msg="Falta el secreto SUPABASE_ACCESS_TOKEN (GitHub → Settings → Secrets and variables → Actions). No se publicó nada. Pasos: docs/lanzamiento/web-push.md"
            echo "::warning title=Sin publicar::$msg"
            echo "### Sin publicar" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ready == 'true'

      - uses: supabase/setup-cli@d239d1052f6f024a8d746d7e5aeddead63b9cb53 # v3.1.0
        if: steps.token.outputs.ready == 'true'
        with:
          version: 2.122.1

      - name: Publicar life-reminders
        if: steps.token.outputs.ready == 'true' && (env.WHICH == 'todas' || env.WHICH == 'life-reminders')
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy life-reminders --no-verify-jwt --use-api --project-ref "$PROJECT_REF"

      - name: Publicar quarantine-held-files
        if: steps.token.outputs.ready == 'true' && (env.WHICH == 'todas' || env.WHICH == 'quarantine-held-files')
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy quarantine-held-files --use-api --project-ref "$PROJECT_REF"

      - name: Resumen
        if: steps.token.outputs.ready == 'true'
        run: |
          {
            echo "### Funciones publicadas ($WHICH)"
            echo "Proyecto: $PROJECT_REF. Revisá Super-admin → Estado → Avisos push en un par de minutos."
          } >> "$GITHUB_STEP_SUMMARY"
