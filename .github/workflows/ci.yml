name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # El resto del repo (Mycen Business) todavía tiene errores de lint previos:
      # se exige lint limpio en Identity, Studio, Life OS y los tests.
      - name: Lint (Identity, Studio, Life OS, tests)
        run: npx eslint src/modules/profile src/modules/studio src/modules/life src/i18n/app src/lib/reservedUsernames.ts api tests vitest.config.ts playwright.config.ts

      - name: Tests unitarios (+ tipos de los tests)
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://mock.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key

      - name: Navegador para E2E
        run: npx playwright install --with-deps chromium

      - name: Tests E2E
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
