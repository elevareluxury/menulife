<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>menulife — El sistema operativo del negocio moderno</title>
    <meta name="description" content="Menús digitales, gestión de mozos, KDS de cocina y analytics — todo en una plataforma premium para negocios gastronómicos." />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- PWA core -->
    <meta name="application-name"               content="MenuLife" />
    <meta name="theme-color"                     content="#0F1115" />
    <meta name="mobile-web-app-capable"          content="yes" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable"          content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title"            content="MenuLife" />

    <!-- MS Tiles -->
    <meta name="msapplication-TileColor"         content="#0F1115" />

    <!-- Open Graph / share -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="MenuLife — Sistema Operativo Gastronómico" />
    <meta property="og:description" content="Menús digitales, gestión de mozos, KDS y analytics en una sola plataforma premium." />
    <meta property="og:image"       content="/icon-512.png" />

    <!-- Fonts: Ruda + Inter + Geist + Poppins + Space Mono (dashboard) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Ruda:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&family=Geist:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <!-- Fonts: Syne + DM Sans + DM Mono (Hub Público) -->
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- Fonts: Hub title fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Grotesk:wght@700&family=Bebas+Neue&display=swap" rel="stylesheet" />

    <!-- GSAP + ScrollTrigger (sync — small, needed before React paint) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <!-- Splitting.js — text char/word animation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/splitting/1.0.6/splitting.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/splitting/1.0.6/splitting.min.css" />

    <!-- Three.js — deferred (large, only needed for hero particles) -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
