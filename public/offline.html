<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sin conexión — MenuLife</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0F1115;
      color: #F5F7FA;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px;
    }
    .card {
      text-align: center;
      max-width: 320px;
      width: 100%;
    }
    .icon {
      font-size: 64px;
      margin-bottom: 24px;
      display: block;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    p {
      color: #98A2B3;
      line-height: 1.6;
      font-size: 15px;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #FF6B7A;
      color: #fff;
      padding: 14px 28px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 15px;
      border: none;
      cursor: pointer;
      transition: opacity .15s;
      box-shadow: 0 8px 24px rgba(255,107,122,.35);
    }
    .btn:active { opacity: .75; }
    .tip {
      margin-top: 28px;
      padding: 16px;
      background: rgba(255,255,255,.05);
      border-radius: 14px;
      font-size: 13px;
      color: #98A2B3;
      line-height: 1.5;
      border: 1px solid rgba(255,255,255,.06);
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">📡</span>
    <h1>Sin conexión</h1>
    <p>Parece que perdiste internet.<br>Verificá tu conexión e intentá de nuevo.</p>
    <button class="btn" onclick="window.location.reload()">
      🔄 Reintentar
    </button>
    <div class="tip">
      💡 Los datos ya cargados siguen disponibles mientras dure tu sesión.
    </div>
  </div>
</body>
</html>
