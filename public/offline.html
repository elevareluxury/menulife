<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sin conexión — menulife</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0F1115;
      color: #fff;
      font-family: system-ui, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .logo {
      width: 48px; height: 48px;
      background: #FF6B7A;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 800;
      margin: 0 auto 20px;
    }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 14px; color: rgba(255,255,255,0.45); line-height: 1.6; }
    button {
      margin-top: 28px;
      padding: 12px 28px;
      background: #FF6B7A;
      color: #fff;
      border: none;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="logo">M</div>
  <h1>Sin conexión</h1>
  <p>Revisá tu conexión a internet<br>e intentá de nuevo.</p>
  <button onclick="location.reload()">Reintentar</button>
</body>
</html>
